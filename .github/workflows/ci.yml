name: 初始化验证

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: npm ci
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run format:check
