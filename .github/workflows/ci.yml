name: 项目验证
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: npm ci
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: npm run db:up
      - run: npm run check
      - run: python -m ruff check deploy/manage.py deploy/dispatch.py
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      - name: Compose语法验证
        run: |
          cp deploy/.env.runtime.example deploy/.env.runtime
          docker compose --env-file deploy/.env.example -f deploy/compose.production.yaml config --quiet
      - if: always()
        run: docker compose --env-file var/local-db/docker.env -f compose.yaml down -v
