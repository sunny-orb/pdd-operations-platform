# 每分钟重新读取；时区为Asia/Shanghai。
enabled = true
timezone = "Asia/Shanghai"
times = ["10:00", "10:30", "11:00"]
max_attempts_per_slot = 2
# 后台串行检查变化；不由页面访问触发。
monitor_enabled = true
monitor_interval_seconds = 900

# 已验证专用会话网页读取；8数仓及2飞书使用固定时点，聚水潭与天气沿原计划。
source_schedule_enabled = true
warehouse_times = ["08:30", "09:40", "10:10", "10:50", "13:10", "15:10", "16:10"]
feishu_times = ["08:20", "10:10"]

# 八个固定数仓来源每周日获准范围对账；每次失败完成后等待至少五分钟。
reconciliation_time = "17:00"
reconciliation_retry_seconds = 300
