# 独立显式启用；需先准备来源身份、浏览器登录和归档目录。
services:
  worker:
    image: ${WORKER_IMAGE:?必须配置WORKER_IMAGE}
    profiles: [sync]
    init: true
    restart: unless-stopped
    mem_limit: 3g
    cpus: 1.0
    pids_limit: 512
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    stop_grace_period: 30s
    env_file:
      - path: ${RUNTIME_ENV_FILE:-./.env.runtime}
        format: raw
    environment:
      APP_ENV: production
      LARKSUITE_CLI_NO_UPDATE_NOTIFIER: "1"
      LARKSUITE_CLI_NO_SKILLS_NOTIFIER: "1"
    volumes:
      - type: bind
        source: ./runtime
        target: /app/var
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-home
        target: /home/app
        bind:
          create_host_path: false
    networks: [app]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
