server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/json application/manifest+json application/xml
               image/svg+xml text/css text/javascript text/plain text/xml;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }
    # 当前 Vite 构建的 JS/CSS 文件名带八位内容指纹。
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
